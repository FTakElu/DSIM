version: 1
frontend:
  phases:
    preBuild:
      commands:
        - bash -c 'cd "Desenvolvimento/3.Implementação/DSIM-COD/frontend" && npm ci --legacy-peer-deps'
    build:
      commands:
        - bash -c 'cd "Desenvolvimento/3.Implementação/DSIM-COD/frontend" && npm run build'
  artifacts:
    baseDirectory: Desenvolvimento/3.Implementação/DSIM-COD/frontend/dist
    files:
      - '**/*'
  cache:
    paths:
      - Desenvolvimento/3.Implementação/DSIM-COD/frontend/node_modules/**/*
